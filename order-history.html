<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการสั่งซื้อ - PP PHONE</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap');
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-[#f7f6f2] min-h-screen text-gray-800 flex flex-col">

  <!-- Navigation Bar -->
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full border-2 border-[#a17d1a] flex flex-col items-center justify-center text-[#a17d1a]">
          <span class="text-[11px] font-extrabold leading-none">PP</span>
          <span class="text-[7px] font-bold tracking-tighter leading-none mt-0.5">PHONE</span>
        </div>
        <span class="text-xl font-extrabold text-[#a17d1a] tracking-wider">PP PHONE</span>
      </a>

      <!-- Menu Navigation -->
      <div class="hidden md:flex items-center gap-8 text-xs font-semibold text-gray-500">
        <a href="index.html" class="hover:text-[#8a6e11] transition">สินค้า</a>
        <a href="order-history.html" class="text-[#8a6e11] border-b-2 border-[#8a6e11] pb-1">ประวัติการสั่งซื้อ</a>
        <a href="manage-products.html" id="linkManage" class="hover:text-[#8a6e11] transition hidden">จัดการสินค้า</a>
        <a href="sales-report.html" id="linkReport" class="hover:text-[#8a6e11] transition hidden">รายงานยอดขาย</a>
      </div>

      <!-- User Profile & Cart Icon -->
      <div class="flex items-center gap-3">
        <a href="cart.html" id="cartBtn" class="relative w-9 h-9 rounded-full bg-[#8a6e11] text-white flex items-center justify-center shadow-sm hover:opacity-90 transition">
          <i class="fa-solid fa-cart-shopping text-xs"></i>
          <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </a>
        
        <div class="flex items-center gap-2">
          <a href="login.html" id="userBadge" class="w-9 h-9 rounded-full bg-[#8a6e11] text-white flex items-center justify-center shadow-sm hover:opacity-90 transition">
            <i class="fa-solid fa-user text-xs"></i>
          </a>
          <button onclick="logout()" id="logoutBtn" class="hidden text-xs text-red-500 font-bold hover:underline ml-1">
            ออกจากระบบ
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900">ประวัติการสั่งซื้อ</h1>
      <p class="text-xs text-gray-400 mt-1">ดูประวัติและสถานะการสั่งซื้อทั้งหมด</p>
    </div>

    <!-- Filter Bar & Search Container -->
    <div class="bg-white/80 backdrop-blur-sm p-3 rounded-2xl border border-gray-100 flex flex-wrap items-center justify-between gap-4 mb-6 shadow-sm">
      
      <!-- Status Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="setStatusFilter('all')" id="btnFilterAll" class="px-4 py-1.5 rounded-xl text-xs font-bold transition bg-[#8a6e11] text-white shadow-sm">
          ทั้งหมด
        </button>
        <button onclick="setStatusFilter('pending')" id="btnFilterPending" class="px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> รอตรวจสอบ
        </button>
        <button onclick="setStatusFilter('approved')" id="btnFilterApproved" class="px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> อนุมัติแล้ว
        </button>
        <button onclick="setStatusFilter('cancelled')" id="btnFilterCancelled" class="px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-red-500"></span> ยกเลิก
        </button>
      </div>

      <!-- Search & Date Filter -->
      <div class="flex items-center gap-3 flex-1 max-w-md w-full">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
          <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="ค้นหารหัสคำสั่งซื้อ, ชื่อลูกค้า, เบอร์โทร..." class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:border-[#8a6e11] transition">
        </div>
        <div class="relative">
          <input type="date" id="dateInput" onchange="filterOrders()" class="bg-gray-50 border border-gray-200 text-xs text-gray-600 py-2 px-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#8a6e11] transition">
        </div>
      </div>
    </div>

    <!-- Orders List Container -->
    <div id="orderList" class="space-y-6">
      <div class="bg-white rounded-2xl p-12 text-center text-gray-400 font-light shadow-sm">
        กำลังโหลดประวัติการสั่งซื้อ...
      </div>
    </div>
  </main>

  <!-- Image Preview Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4" onclick="closeImageModal()">
    <div class="relative max-w-xl w-full bg-white rounded-2xl p-2 shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
      <button onclick="closeImageModal()" class="absolute top-3 right-3 bg-gray-100 hover:bg-gray-200 text-gray-700 w-8 h-8 rounded-full flex items-center justify-center font-bold z-10 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img id="modalImg" src="" class="w-full h-auto max-h-[80vh] object-contain rounded-xl">
    </div>
  </div>

  <script>
    let currentUser = {};
    let allOrders = [];
    let isAdminOrStaff = false;
    let currentStatusFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      } catch (e) {
        currentUser = {};
      }
      
      const role = String(
        currentUser.role || 
        (currentUser.userData && currentUser.userData.role) || 
        'customer'
      ).toLowerCase();

      isAdminOrStaff = ['admin', 'staff', 'employee'].includes(role);

      applyRolePermissions();

      const userId = getUserId();
      const isLoggedIn = currentUser && Object.keys(currentUser).length > 0;
      
      if (!isLoggedIn || (!isAdminOrStaff && !userId)) {
        alert('กรุณาล็อกอินเข้าสู่ระบบก่อน');
        window.location.href = 'login.html';
        return;
      }

      await loadOrderHistory();
    });

    function applyRolePermissions() {
      const linkManage = document.getElementById('linkManage');
      const linkReport = document.getElementById('linkReport');
      const cartBtn = document.getElementById('cartBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      
      const role = String(
        currentUser.role || 
        (currentUser.userData && currentUser.userData.role) || 
        'customer'
      ).toLowerCase();

      if (currentUser.username || getUserId()) {
        if (logoutBtn) logoutBtn.classList.remove('hidden');
      }

      if (role === 'admin') {
        if (linkManage) linkManage.classList.remove('hidden');
        if (linkReport) linkReport.classList.remove('hidden');
        if (cartBtn) cartBtn.classList.add('hidden');
      } else if (['staff', 'employee'].includes(role)) {
        if (linkManage) linkManage.classList.remove('hidden');
        if (linkReport) linkReport.classList.add('hidden');
        if (cartBtn) cartBtn.classList.add('hidden');
      } else {
        if (linkManage) linkManage.classList.add('hidden');
        if (linkReport) linkReport.classList.add('hidden');
        if (cartBtn) cartBtn.classList.remove('hidden');
      }
    }

    function getUserId() {
      if (!currentUser) return null;
      return currentUser.id 
          || currentUser.user_id 
          || currentUser.userId 
          || (currentUser.userData && currentUser.userData.id)
          || (currentUser.userData && currentUser.userData.username)
          || (currentUser.user && currentUser.user.id) 
          || currentUser.username
          || currentUser.email
          || null;
    }

    async function loadOrderHistory() {
      const container = document.getElementById('orderList');
      const userId = getUserId();

      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (!client) throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้');

        // ดึงข้อมูล orders พร้อมรายการสินค้า
        let query = client
          .from('orders')
          .select(`
            *,
            order_items (
              id,
              quantity,
              price,
              products (
                id,
                name,
                code,
                image_url
              )
            )
          `)
          .order('created_at', { ascending: false });

        if (!isAdminOrStaff) {
          query = query.eq('user_id', userId);
        }

        const { data: orders, error } = await query;
        if (error) throw error;

        if (!orders || orders.length === 0) {
          allOrders = [];
          renderOrders([]);
          return;
        }

        // ดึงข้อมูลผู้ใช้งานจากตาราง users
        const userIds = [...new Set(orders.map(o => o.user_id).filter(Boolean))];
        let usersMap = {};

        if (userIds.length > 0) {
          try {
            const { data: uData } = await client
              .from('users')
              .select('*')
              .in('id', userIds);

            if (uData) {
              uData.forEach(u => {
                usersMap[u.id] = u;
              });
            }
          } catch (uErr) {
            console.warn('ไม่สามารถดึงข้อมูลจากตาราง users ได้:', uErr);
          }
        }

        // จัดการรวมข้อมูลโปรไฟล์ลูกค้า และค้นหารูปสลิป
        allOrders = orders.map(order => {
          const u = usersMap[order.user_id] || {};

          // ค้นหารูปภาพสลิปจากชื่อคอลัมน์ที่เป็นไปได้
          const slipImage = order.slip_url || order.slip_image || order.payment_slip || order.slip || null;

          return {
            ...order,
            slip_url: slipImage,
            profiles: {
              full_name: order.customer_name || u.full_name || u.name || u.username || u.first_name || 'ลูกค้าทั่วไป',
              phone: order.phone || u.phone || u.tel || u.mobile || '-',
              email: order.email || u.email || '-',
              address: order.address || u.address || 'ไม่ระบุที่อยู่จัดส่ง'
            }
          };
        });

        renderOrders(allOrders);

      } catch (err) {
        console.error('Error loading orders:', err);
        container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-red-500 text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('orderList');
      container.innerHTML = '';

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center text-gray-400 font-light shadow-sm">
            <i class="fa-solid fa-receipt text-4xl mb-3 text-gray-300"></i>
            <p>ไม่พบรายการสั่งซื้อ</p>
          </div>`;
        return;
      }

      orders.forEach(order => {
        const orderDate = new Date(order.created_at).toLocaleString('th-TH', {
          day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const profile = order.profiles || {};
        const customerName = profile.full_name;
        const customerPhone = profile.phone;
        const customerEmail = profile.email;
        const customerAddress = profile.address;
        const status = order.status || 'pending';

        const orderCard = document.createElement('div');
        orderCard.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden';

        let itemsHtml = '';
        (order.order_items || []).forEach(item => {
          const product = item.products || {};
          const colorInfo = item.color ? `สี: ${item.color} | ` : '';
          itemsHtml += `
            <div class="flex items-center justify-between gap-4 p-3 bg-gray-50/60 rounded-xl my-2">
              <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-white rounded-lg p-1 shrink-0 flex items-center justify-center border border-gray-100">
                  <img src="${product.image_url || 'https://via.placeholder.com/100'}" class="object-contain h-full w-full">
                </div>
                <div>
                  <h4 class="font-bold text-gray-900 text-xs">${product.name || 'สินค้า'}</h4>
                  <p class="text-[10px] text-gray-400 mt-0.5">${colorInfo}SKU: ${product.code || product.id}</p>
                  <p class="text-[10px] text-gray-500 mt-0.5">จำนวน ${item.quantity} เครื่อง × ฿${Number(item.price).toLocaleString()}</p>
                </div>
              </div>
              <div class="text-right">
                <span class="text-xs font-extrabold text-gray-900">฿${Number(item.price * item.quantity).toLocaleString()}</span>
              </div>
            </div>
          `;
        });

        // ส่วนแสดงผลสลิปการโอนเงิน
        let slipHtml = '';
        if (order.slip_url) {
          slipHtml = `
            <div class="relative group cursor-pointer border border-gray-200 rounded-xl overflow-hidden bg-gray-100 flex items-center justify-center h-48" onclick="openImageModal('${order.slip_url}')">
              <img src="${order.slip_url}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300">
              <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold gap-1.5">
                <i class="fa-solid fa-magnifying-glass-plus"></i> คลิกเพื่อดูสลิปใหญ่
              </div>
            </div>
          `;
        } else {
          slipHtml = `
            <div class="bg-gray-50 p-6 rounded-xl border border-dashed border-gray-200 text-center text-gray-400">
              <i class="fa-solid fa-file-image text-3xl mb-2 text-gray-300"></i>
              <p class="text-[11px]">ไม่พบหลักฐานการชำระเงิน</p>
            </div>
          `;
        }

        orderCard.innerHTML = `
          <!-- Header Status Bar -->
          <div class="p-5 flex flex-wrap items-center justify-between gap-4 border-b border-gray-50">
            <div class="flex items-center gap-8">
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">รหัสคำสั่งซื้อ</span>
                <span class="text-sm font-bold text-gray-900">ORD-${order.id}</span>
              </div>
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">วันที่ทำรายการ</span>
                <span class="text-xs font-semibold text-gray-600">${orderDate}</span>
              </div>
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">สถานะคำสั่งซื้อ</span>
                ${getStatusBadge(status)}
              </div>
            </div>

            <div class="text-right">
              <span class="text-[10px] text-gray-400 block font-medium">ยอดชำระสุทธิ</span>
              <span class="text-xl font-black text-[#8a6e11]">฿${Number(order.total_amount || 0).toLocaleString()}</span>
            </div>
          </div>

          <!-- Details Section -->
          <div class="p-5 grid grid-cols-1 md:grid-cols-12 gap-6 bg-white">
            
            <!-- Customer & Shipping Info -->
            <div class="md:col-span-7 bg-gray-50/50 p-4 rounded-xl border border-gray-100 flex flex-col justify-between">
              <div>
                <div class="flex items-center gap-2 mb-3">
                  <i class="fa-regular fa-address-card text-amber-600 text-xs"></i>
                  <h5 class="text-xs font-bold text-gray-800">ข้อมูลลูกค้าและการจัดส่ง</h5>
                </div>
                <div class="grid grid-cols-2 gap-3 text-[11px] text-gray-600 mb-3">
                  <div>
                    <span class="text-gray-400 block text-[10px]">ผู้รับสินค้า</span>
                    <span class="font-bold text-gray-800">${customerName}</span>
                  </div>
                  <div>
                    <span class="text-gray-400 block text-[10px]">เบอร์โทรศัพท์</span>
                    <span class="font-semibold text-gray-800">${customerPhone}</span>
                  </div>
                  <div>
                    <span class="text-gray-400 block text-[10px]">อีเมล</span>
                    <span class="text-gray-700">${customerEmail}</span>
                  </div>
                  <div>
                    <span class="text-gray-400 block text-[10px]">รหัสผู้ใช้งาน</span>
                    <span class="font-medium text-gray-800">${order.user_id || '-'}</span>
                  </div>
                </div>
                <div class="text-[11px] text-gray-600 pt-2 border-t border-gray-100">
                  <span class="text-gray-400 block text-[10px]">ที่อยู่จัดส่ง</span>
                  <p class="mt-0.5 leading-relaxed font-medium text-gray-800">${customerAddress}</p>
                </div>
              </div>

              <!-- Product Items Box -->
              <div class="mt-4 pt-3 border-t border-gray-100">
                <h6 class="text-[11px] font-bold text-gray-700 mb-1">รายการสินค้าในออเดอร์</h6>
                ${itemsHtml}
              </div>
            </div>

            <!-- Payment Slip & Approval Section -->
            <div class="md:col-span-5 bg-gray-50/50 p-4 rounded-xl border border-gray-100 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <i class="fa-regular fa-file-lines text-amber-600 text-xs"></i>
                    <h5 class="text-xs font-bold text-gray-800">หลักฐานการชำระเงิน (สลิปโอน)</h5>
                  </div>
                </div>

                <!-- Slip Display -->
                ${slipHtml}
              </div>

              <!-- Admin Action Buttons -->
              ${isAdminOrStaff && status === 'pending' ? `
                <div class="mt-4 pt-3 border-t border-gray-100">
                  <span class="text-[10px] font-bold text-gray-500 block mb-2">การอนุมัติคำสั่งซื้อ (เจ้าหน้าที่)</span>
                  <div class="grid grid-cols-2 gap-2">
                    <button onclick="updateOrderStatus('${order.id}', 'approved')" class="bg-[#795d0d] hover:bg-[#634c09] text-white py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                      <i class="fa-solid fa-circle-check text-xs"></i> อนุมัติ
                    </button>
                    <button onclick="updateOrderStatus('${order.id}', 'cancelled')" class="bg-white border border-red-200 hover:bg-red-50 text-red-600 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                      <i class="fa-solid fa-circle-xmark text-xs"></i> ปฏิเสธ
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;

        container.appendChild(orderCard);
      });
    }

    function getStatusBadge(status) {
      if (status === 'approved' || status === 'completed') {
        return `<span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ชำระแล้ว (อนุมัติเรียบร้อย)
        </span>`;
      } else if (status === 'cancelled') {
        return `<span class="inline-flex items-center gap-1.5 bg-red-50 text-red-700 text-[10px] font-bold px-2.5 py-1 rounded-full border border-red-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> ยกเลิกคำสั่งซื้อ
        </span>`;
      } else {
        return `<span class="inline-flex items-center gap-1.5 bg-amber-50 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full border border-amber-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> รอตรวจสอบการชำระเงิน
        </span>`;
      }
    }

    function openImageModal(url) {
      document.getElementById('modalImg').src = url;
      const modal = document.getElementById('imageModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;

      const buttons = {
        all: document.getElementById('btnFilterAll'),
        pending: document.getElementById('btnFilterPending'),
        approved: document.getElementById('btnFilterApproved'),
        cancelled: document.getElementById('btnFilterCancelled')
      };

      Object.keys(buttons).forEach(key => {
        if (buttons[key]) {
          if (key === status) {
            buttons[key].className = 'px-4 py-1.5 rounded-xl text-xs font-bold transition bg-[#8a6e11] text-white shadow-sm';
          } else {
            buttons[key].className = 'px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5';
          }
        }
      });

      filterOrders();
    }

    function filterOrders() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedDate = document.getElementById('dateInput').value;

      const filtered = allOrders.filter(order => {
        const profile = order.profiles || {};
        const customerName = (profile.full_name || '').toLowerCase();
        const customerPhone = (profile.phone || '').toLowerCase();
        const customerAddress = (profile.address || '').toLowerCase();
        const orderIdStr = String(order.id).toLowerCase();
        const userIdStr = String(order.user_id).toLowerCase();

        const matchesSearch = 
          orderIdStr.includes(search) ||
          userIdStr.includes(search) ||
          customerName.includes(search) ||
          customerPhone.includes(search) ||
          customerAddress.includes(search);

        let matchesDate = true;
        if (selectedDate) {
          const orderDateStr = new Date(order.created_at).toISOString().split('T')[0];
          matchesDate = (orderDateStr === selectedDate);
        }

        let matchesStatus = true;
        if (currentStatusFilter === 'pending') {
          matchesStatus = (order.status === 'pending');
        } else if (currentStatusFilter === 'approved') {
          matchesStatus = (order.status === 'approved' || order.status === 'completed');
        } else if (currentStatusFilter === 'cancelled') {
          matchesStatus = (order.status === 'cancelled');
        }

        return matchesSearch && matchesDate && matchesStatus;
      });

      renderOrders(filtered);
    }

    async function updateOrderStatus(orderId, newStatus) {
      if (!confirm(`คุณต้องการเปลี่ยนสถานะคำสั่งซื้อเป็น ${newStatus === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ/ยกเลิก'} ใช่หรือไม่?`)) {
        return;
      }

      try {
        const client = DB.getClient();
        const { error } = await client
          .from('orders')
          .update({ status: newStatus })
          .eq('id', orderId);

        if (error) throw error;

        alert('อัปเดตสถานะเรียบร้อยแล้ว');
        await loadOrderHistory();
      } catch (err) {
        console.error('Error updating order:', err);
        alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ: ' + err.message);
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('userSession');
      window.location.href = 'login.html';
    }
  </script>
</body>
