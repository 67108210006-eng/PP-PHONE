<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการสั่งซื้อ - PP PHONE</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-[#f7f6f2] min-h-screen text-gray-800 flex flex-col">

  <!-- Navigation Bar -->
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- โลโก้ PP PHONE -->
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full border-2 border-[#8a6e11] flex flex-col items-center justify-center text-[#8a6e11]">
          <span class="text-[11px] font-extrabold leading-none">PP</span>
          <span class="text-[7px] font-bold tracking-tighter leading-none mt-0.5">PHONE</span>
        </div>
        <span class="text-xl font-extrabold text-[#8a6e11] tracking-wider">PP PHONE</span>
      </a>

      <!-- เมนูตรงกลาง -->
      <div class="flex items-center gap-8 text-sm font-semibold text-gray-600">
        <a href="index.html#products" class="hover:text-[#8a6e11] transition py-1">สินค้า</a>
        <a href="order-history.html" class="text-[#8a6e11] font-bold py-1">ประวัติการสั่งซื้อ</a>
        <a href="manage-products.html" id="navProducts" class="hover:text-[#8a6e11] transition py-1 hidden">จัดการสินค้า</a>
        <a href="sales-report.html" id="navSales" class="hover:text-[#8a6e11] transition py-1 hidden">รายงานยอดขาย</a>
      </div>

      <!-- ไอคอนขวามือ -->
      <div class="flex items-center gap-4">
        <a href="cart.html" class="relative w-10 h-10 rounded-full bg-[#8a6e11] text-white flex items-center justify-center transition hover:opacity-90">
          <i class="fa-solid fa-cart-shopping text-sm"></i>
          <span id="navCartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </a>

        <div class="w-10 h-10 rounded-full bg-[#8a6e11] text-white flex items-center justify-center text-base font-bold">
          <i class="fa-solid fa-user"></i>
        </div>

        <button onclick="logout()" class="text-xs font-bold text-red-500 hover:text-red-600 transition ml-1">
          ออกจากระบบ
        </button>
      </div>

    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-6 py-8 flex-1 w-full">
    <div class="mb-6 flex justify-between items-end">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">ประวัติการสั่งซื้อ</h1>
        <p class="text-xs text-gray-500 mt-1">รายการคำสั่งซื้อทั้งหมดของคุณและการตรวจสอบสลิป</p>
      </div>
      <button onclick="loadOrderHistory()" class="text-xs bg-white border border-gray-200 shadow-sm hover:bg-gray-50 text-gray-700 font-bold px-3 py-2 rounded-xl transition flex items-center gap-1">
        <i class="fa-solid fa-rotate-right text-[#8a6e11]"></i> รีเฟรชข้อมูล
      </button>
    </div>

    <!-- รายการคำสั่งซื้อ -->
    <div id="ordersContainer" class="space-y-4">
      <div class="bg-white rounded-2xl p-12 text-center text-gray-400 font-light shadow-sm">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-[#8a6e11]"></i>
        <p class="text-xs">กำลังโหลดประวัติการสั่งซื้อ...</p>
      </div>
    </div>
  </main>

  <!-- Modal สำหรับดูสลิปโอนเงิน -->
  <div id="slipModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 relative shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3 mb-3">
        <h3 class="font-bold text-gray-900 text-sm flex items-center gap-2">
          <i class="fa-solid fa-file-invoice-dollar text-[#8a6e11]"></i> หลักฐานการโอนเงิน (สลิป)
        </h3>
        <button onclick="closeSlipModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="bg-gray-100 rounded-xl overflow-hidden min-h-[250px] flex items-center justify-center border">
        <img id="slipModalImage" src="" alt="สลิปการโอนเงิน" class="max-h-[70vh] object-contain mx-auto">
      </div>
      <div class="mt-4 text-center">
        <a id="downloadSlipBtn" href="#" target="_blank" class="inline-block text-xs bg-[#8a6e11] text-white font-bold px-4 py-2 rounded-xl hover:bg-[#725a0d] transition">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดไฟล์ขนาดเต็ม
        </a>
      </div>
    </div>
  </div>

  <script>
    let currentUser = {};

    document.addEventListener('DOMContentLoaded', async () => {
      const role = localStorage.getItem('pp_user_role') || 'customer';
      if (role === 'admin') {
        document.getElementById('navProducts')?.classList.remove('hidden');
        document.getElementById('navSales')?.classList.remove('hidden');
      } else if (role === 'staff') {
        document.getElementById('navProducts')?.classList.remove('hidden');
      }

      currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      
      const userId = getUserId();
      if (!userId) {
        alert('กรุณาล็อกอินเข้าสู่ระบบก่อนดูประวัติการสั่งซื้อ');
        window.location.href = 'login.html';
        return;
      }

      await loadOrderHistory();
      updateCartBadge();
    });

    function getUserId() {
      if (!currentUser) return null;
      return currentUser.id 
          || currentUser.user_id 
          || currentUser.userId 
          || (currentUser.userData && currentUser.userData.id)
          || (currentUser.user && currentUser.user.id) 
          || null;
    }

    async function loadOrderHistory() {
      const container = document.getElementById('ordersContainer');
      const userId = getUserId();

      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (!client) throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้');

        // ดึงรายการคำสั่งซื้อของผู้ใช้งาน
        const { data: orders, error: ordersError } = await client
          .from('orders')
          .select('*')
          .eq('user_id', userId)
          .order('created_at', { ascending: false });

        if (ordersError) throw ordersError;

        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="bg-white rounded-2xl p-12 text-center text-gray-400 font-light shadow-sm">
              <i class="fa-solid fa-receipt text-4xl mb-3 text-gray-300"></i>
              <p class="text-sm font-semibold">ยังไม่มีประวัติการสั่งซื้อ</p>
              <a href="index.html" class="inline-block mt-4 bg-[#8a6e11] text-white text-xs px-5 py-2 rounded-xl font-bold">ไปเลือกซื้อสินค้า</a>
            </div>`;
          return;
        }

        container.innerHTML = '';

        for (const order of orders) {
          // ดึงรายการ order_items พร้อมข้อมูลสินค้า
          const { data: items, error: itemsError } = await client
            .from('order_items')
            .select(`
              quantity,
              price,
              products ( name, image_url )
            `)
            .eq('order_id', order.id);

          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4';

          const formattedDate = new Date(order.created_at || Date.now()).toLocaleString('th-TH', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          // กำหนดสถานะคำสั่งซื้อ
          let statusBadge = '<span class="bg-amber-100 text-amber-700 text-xs px-3 py-1 rounded-full font-bold"><i class="fa-solid fa-clock"></i> รอตรวจสอบ</span>';
          if (order.status === 'paid' || order.status === 'completed' || order.status === 'approved') {
            statusBadge = '<span class="bg-emerald-100 text-emerald-700 text-xs px-3 py-1 rounded-full font-bold"><i class="fa-solid fa-circle-check"></i> ชำระเงินเรียบร้อย</span>';
          } else if (order.status === 'cancelled' || order.status === 'rejected') {
            statusBadge = '<span class="bg-red-100 text-red-700 text-xs px-3 py-1 rounded-full font-bold"><i class="fa-solid fa-circle-xmark"></i> ยกเลิกแล้ว</span>';
          }

          let itemsHtml = '';
          if (items && items.length > 0) {
            itemsHtml = items.map(item => `
              <div class="flex items-center gap-3 text-xs py-2 border-b border-gray-50 last:border-none">
                <img src="${item.products?.image_url || 'https://via.placeholder.com/80'}" class="w-12 h-12 object-contain bg-gray-50 rounded-lg p-1 border shrink-0">
                <div class="flex-1">
                  <span class="font-bold text-gray-800 block">${item.products?.name || 'สินค้า'}</span>
                  <span class="text-gray-400">จำนวน: ${item.quantity} ชิ้น</span>
                </div>
                <div class="text-right font-bold text-gray-700">
                  ฿${(Number(item.price || 0) * item.quantity).toLocaleString()}
                </div>
              </div>
            `).join('');
          }

          // ปุ่มดูสลิป
          const slipButtonHtml = order.slip_url ? `
            <button onclick="viewSlip('${order.slip_url}')" class="text-xs bg-amber-50 text-[#8a6e11] hover:bg-amber-100 border border-amber-200 font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
              <i class="fa-solid fa-file-invoice"></i> ดูสลิปโอนเงิน
            </button>
          ` : `
            <span class="text-[11px] text-gray-400 italic">ไม่มีแนบสลิป</span>
          `;

          card.innerHTML = `
            <div class="flex flex-wrap justify-between items-center gap-2 border-b pb-3">
              <div>
                <span class="text-[11px] text-gray-400 block">หมายเลขคำสั่งซื้อ: #${order.id}</span>
                <span class="text-xs text-gray-500 font-medium">${formattedDate}</span>
              </div>
              <div class="flex items-center gap-3">
                ${statusBadge}
              </div>
            </div>

            <div class="space-y-1">
              ${itemsHtml}
            </div>

            <div class="pt-3 border-t flex flex-wrap justify-between items-center gap-2 text-xs">
              <div class="flex items-center gap-2">
                ${slipButtonHtml}
              </div>
              <div class="text-right">
                <span class="text-gray-500">ราคารวมสุทธิ: </span>
                <span class="text-base font-extrabold text-[#8a6e11]">฿${Number(order.total_amount || 0).toLocaleString()}</span>
              </div>
            </div>
          `;

          container.appendChild(card);
        }

      } catch (err) {
        console.error('Error loading order history:', err);
        container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-red-500 text-xs">เกิดข้อผิดพลาดในการโหลดประวัติ: ${err.message}</div>`;
      }
    }

    async function updateCartBadge() {
      const userId = getUserId();
      if (!userId) return;
      try {
        const client = DB.getClient();
        const { data } = await client.from('cart').select('quantity').eq('user_id', userId);
        const count = (data || []).reduce((sum, i) => sum + i.quantity, 0);
        document.getElementById('navCartBadge').innerText = count;
      } catch (e) {
        console.log('Error update cart badge');
      }
    }

    function viewSlip(url) {
      document.getElementById('slipModalImage').src = url;
      document.getElementById('downloadSlipBtn').href = url;
      document.getElementById('slipModal').classList.remove('hidden');
    }

    function closeSlipModal() {
      document.getElementById('slipModal').classList.add('hidden');
    }

    function logout() {
      if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
        localStorage.removeItem('pp_user_role');
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
