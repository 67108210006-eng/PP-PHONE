<script>
    let currentUser = {};
    let allOrders = [];
    let isAdminOrStaff = false;
    let currentStatusFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      } catch (e) {
        currentUser = {};
      }
      
      const role = String(
        currentUser.role || 
        (currentUser.userData && currentUser.userData.role) || 
        localStorage.getItem('pp_user_role') ||
        'customer'
      ).toLowerCase();

      isAdminOrStaff = ['admin', 'staff', 'employee'].includes(role);

      applyRolePermissions();

      const userId = getUserId();
      const isLoggedIn = currentUser && Object.keys(currentUser).length > 0;
      
      if (!isLoggedIn || (!isAdminOrStaff && !userId)) {
        alert('กรุณาล็อกอินเข้าสู่ระบบก่อน');
        window.location.href = 'login.html';
        return;
      }

      await loadOrderHistory();
      await updateCartBadge();
    });

    // --- ฟังก์ชันออกจากระบบ (เพิ่มที่นี่) ---
    function logout() {
      if (confirm('คุณต้องการออกจากระบบหรือไม่?')) {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('pp_user_role');
        sessionStorage.clear();
        
        // ถ้ามีใช้งาน Supabase Auth สามารถปลดล็อกบรรทัดนี้ได้
        // if (typeof DB !== 'undefined' && DB.getClient) { DB.getClient().auth.signOut(); }

        window.location.href = 'login.html';
      }
    }

    // --- ฟังก์ชันอัปเดตจำนวนสินค้าในตะกร้า (เพิ่มที่นี่) ---
    async function updateCartBadge() {
      const cartCountEl = document.getElementById('cartCount');
      if (!cartCountEl) return;
      
      try {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
        cartCountEl.textContent = totalItems;
      } catch (e) {
        cartCountEl.textContent = '0';
      }
    }

    function applyRolePermissions() {
      const linkManage = document.getElementById('linkManage');
      const linkReport = document.getElementById('linkReport');
      const cartBtn = document.getElementById('cartBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      
      const role = String(
        currentUser.role || 
        (currentUser.userData && currentUser.userData.role) || 
        localStorage.getItem('pp_user_role') ||
        'customer'
      ).toLowerCase();

      if (currentUser.username || getUserId()) {
        if (logoutBtn) logoutBtn.classList.remove('hidden');
      }

      if (role === 'admin') {
        if (linkManage) linkManage.classList.remove('hidden');
        if (linkReport) linkReport.classList.remove('hidden');
        if (cartBtn) cartBtn.classList.add('hidden');
      } else if (['staff', 'employee'].includes(role)) {
        if (linkManage) linkManage.classList.remove('hidden');
        if (linkReport) linkReport.classList.add('hidden');
        if (cartBtn) cartBtn.classList.add('hidden');
      } else {
        if (linkManage) linkManage.classList.add('hidden');
        if (linkReport) linkReport.classList.add('hidden');
        if (cartBtn) cartBtn.classList.remove('hidden');
      }
    }

    function getUserId() {
      if (!currentUser) return null;
      return currentUser.id 
          || currentUser.user_id 
          || currentUser.userId 
          || (currentUser.userData && currentUser.userData.id)
          || (currentUser.userData && currentUser.userData.username)
          || (currentUser.user && currentUser.user.id) 
          || currentUser.username
          || currentUser.email
          || null;
    }

    function extractSlipUrl(order) {
      if (!order) return null;

      const possibleKeys = [
        'slip_url', 'slip_image', 'payment_slip', 'slip', 
        'slip_path', 'image_url', 'proof_of_payment', 'receipt_url', 'slip_img'
      ];

      for (let key of possibleKeys) {
        if (order[key] && typeof order[key] === 'string' && order[key].trim() !== '') {
          let url = order[key].trim();

          if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:image/')) {
            return url;
          }

          if (typeof DB !== 'undefined' && DB.getClient) {
            try {
              const client = DB.getClient();
              const { data: slipData } = client.storage.from('slips').getPublicUrl(url);
              if (slipData && slipData.publicUrl) return slipData.publicUrl;
            } catch (e) {
              console.warn('Storage URL error:', e);
            }
          }
          return url;
        }
      }
      return null;
    }

    function extractProductImageUrl(product) {
      if (!product) return 'https://via.placeholder.com/150?text=No+Image';
      
      const imgKey = product.image_url || product.img || product.product_image || product.image;
      if (!imgKey || typeof imgKey !== 'string' || imgKey.trim() === '') {
        return 'https://via.placeholder.com/150?text=No+Image';
      }

      let url = imgKey.trim();
      if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:image/')) {
        return url;
      }

      if (typeof DB !== 'undefined' && DB.getClient) {
        try {
          const client = DB.getClient();
          const { data } = client.storage.from('products').getPublicUrl(url);
          if (data && data.publicUrl) return data.publicUrl;
        } catch (e) {}
      }
      return url;
    }

    async function loadOrderHistory() {
      const container = document.getElementById('orderList');
      const userId = getUserId();

      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (!client) throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้');

        let query = client.from('orders').select('*').order('created_at', { ascending: false });

        if (!isAdminOrStaff) {
          query = query.eq('user_id', userId);
        }

        const { data: orders, error } = await query;
        if (error) throw error;

        if (!orders || orders.length === 0) {
          allOrders = [];
          renderOrders([]);
          return;
        }

        const userIds = [...new Set(orders.map(o => o.user_id).filter(Boolean))];
        let usersMap = {};

        if (userIds.length > 0) {
          try {
            const { data: uData } = await client.from('users').select('*').in('id', userIds);
            if (uData) {
              uData.forEach(u => { usersMap[u.id] = u; });
            }
          } catch (uErr) {
            console.warn('ไม่สามารถดึงข้อมูลผู้ใช้ได้:', uErr);
          }
        }

        const orderIds = orders.map(o => o.id);
        let itemsMap = {};

        if (orderIds.length > 0) {
          const { data: itemsData } = await client
            .from('order_items')
            .select('*, products(*)')
            .in('order_id', orderIds);

          if (itemsData) {
            itemsData.forEach(item => {
              if (!itemsMap[item.order_id]) itemsMap[item.order_id] = [];
              itemsMap[item.order_id].push(item);
            });
          }
        }

        allOrders = orders.map(order => {
          const u = usersMap[order.user_id] || {};
          const slipImage = extractSlipUrl(order);

          return {
            ...order,
            order_items: itemsMap[order.id] || order.order_items || order.items || [],
            slip_url: slipImage,
            profiles: {
              full_name: order.customer_name || u.full_name || u.name || u.username || 'ลูกค้าทั่วไป',
              phone: order.phone || u.phone || u.tel || '-',
              email: order.email || u.email || '-',
              address: order.address || order.shipping_address || u.address || 'ไม่ระบุที่อยู่จัดส่ง'
            }
          };
        });

        filterOrders();

      } catch (err) {
        console.error('Error loading orders:', err);
        container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-red-500 text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('orderList');
      container.innerHTML = '';

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center text-gray-400 font-light shadow-sm">
            <i class="fa-solid fa-receipt text-4xl mb-3 text-gray-300"></i>
            <p>ไม่พบรายการสั่งซื้อ</p>
          </div>`;
        return;
      }

      orders.forEach(order => {
        const orderDate = new Date(order.created_at).toLocaleString('th-TH', {
          day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const profile = order.profiles || {};
        const customerName = profile.full_name;
        const customerPhone = profile.phone;
        const customerEmail = profile.email;
        const customerAddress = profile.address;
        const status = order.status || 'pending';

        const orderCard = document.createElement('div');
        orderCard.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transition duration-200';

        let itemsHtml = '';
        (order.order_items || []).forEach(item => {
          const product = item.products || item || {};
          const productImgUrl = extractProductImageUrl(product);
          const colorInfo = item.color ? `สี: ${item.color} | ` : '';

          itemsHtml += `
            <div class="flex items-center justify-between gap-4 p-3 bg-gray-50/80 rounded-xl my-2 border border-gray-100">
              <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-white rounded-lg p-1 shrink-0 flex items-center justify-center border border-gray-200 overflow-hidden">
                  <img src="${productImgUrl}" 
                       onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=No+Img';" 
                       class="object-contain h-full w-full rounded">
                </div>
                <div>
                  <h4 class="font-bold text-gray-900 text-xs">${product.name || item.name || item.product_name || 'สินค้า'}</h4>
                  <p class="text-[10px] text-gray-400 mt-0.5">${colorInfo}SKU: ${product.code || product.sku || product.id || '-'}</p>
                  <p class="text-[10px] text-[#8a6e11] font-semibold mt-0.5">จำนวน ${item.quantity || 1} เครื่อง × ฿${Number(item.price || 0).toLocaleString()}</p>
                </div>
              </div>
              <div class="text-right">
                <span class="text-xs font-extrabold text-gray-900">฿${Number((item.price || 0) * (item.quantity || 1)).toLocaleString()}</span>
              </div>
            </div>
          `;
        });

        let slipHtml = '';
        if (order.slip_url) {
          slipHtml = `
            <div class="relative group cursor-pointer border border-gray-200 rounded-xl overflow-hidden bg-gray-900 flex items-center justify-center h-52 shadow-inner" onclick="openImageModal('${order.slip_url}')">
              <img src="${order.slip_url}" 
                   onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-center p-4 text-red-400 text-xs\\'><i class=\\'fa-solid fa-triangle-exclamation text-xl mb-1 block\\'></i>ไม่สามารถโหลดรูปสลิปได้</div>';" 
                   class="w-full h-full object-contain group-hover:scale-105 transition duration-300">
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center text-white text-xs font-bold gap-2 backdrop-blur-[1px]">
                <i class="fa-solid fa-magnifying-glass-plus text-xl"></i>
                <span>คลิกเพื่อดูสลิปขนาดใหญ่</span>
              </div>
            </div>
          `;
        } else {
          slipHtml = `
            <div class="bg-gray-50 p-6 rounded-xl border border-dashed border-gray-200 text-center text-gray-400 flex flex-col items-center justify-center h-52">
              <i class="fa-solid fa-receipt text-4xl mb-2 text-gray-300"></i>
              <p class="text-xs font-medium">ยังไม่มีสลิปการโอนเงิน</p>
              <p class="text-[10px] text-gray-300 mt-1">หรือยังไม่ได้อัปโหลดหลักฐาน</p>
            </div>
          `;
        }

        orderCard.innerHTML = `
          <!-- Header -->
          <div class="p-5 flex flex-wrap items-center justify-between gap-4 cursor-pointer hover:bg-gray-50/80 transition" onclick="toggleOrderDetail('${order.id}')">
            <div class="flex items-center gap-4 md:gap-6 flex-wrap">
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">รหัสคำสั่งซื้อ</span>
                <span class="text-sm font-bold text-gray-900">ORD-${order.id}</span>
              </div>
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">ชื่อลูกค้า</span>
                <span class="text-xs font-bold text-gray-800">${customerName}</span>
              </div>
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">วันที่ทำรายการ</span>
                <span class="text-xs font-semibold text-gray-600">${orderDate}</span>
              </div>
              <div>
                <span class="text-[10px] text-gray-400 block font-medium">สถานะ</span>
                ${getStatusBadge(status)}
              </div>
            </div>

            <div class="flex items-center gap-4 ml-auto">
              <div class="text-right">
                <span class="text-[10px] text-gray-400 block font-medium">ยอดชำระสุทธิ</span>
                <span class="text-lg md:text-xl font-black text-[#8a6e11]">฿${Number(order.total_amount || order.total_price || 0).toLocaleString()}</span>
              </div>
            </div>
          </div>

          <!-- Body (ซ่อนไว้แบบ Toggle) -->
          <div id="detail-${order.id}" class="hidden p-5 border-t border-gray-100 bg-white grid grid-cols-1 md:grid-cols-12 gap-6">
            <div class="md:col-span-7 bg-gray-50/50 p-4 rounded-xl border border-gray-100 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-3">
                  <div class="flex items-center gap-2">
                    <i class="fa-regular fa-address-card text-amber-600 text-xs"></i>
                    <h5 class="text-xs font-bold text-gray-800">ข้อมูลลูกค้าและการจัดส่ง</h5>
                  </div>
                  ${isAdminOrStaff ? `
                    <button onclick="editAddress('${order.id}')" id="btnEditAddress-${order.id}" class="text-[10px] text-[#8a6e11] hover:underline font-bold flex items-center gap-1">
                      <i class="fa-solid fa-pen-to-square"></i> แก้ไขที่อยู่
                    </button>
                  ` : ''}
                </div>
                <div class="grid grid-cols-2 gap-3 text-[11px] text-gray-600 mb-3">
                  <div>
                    <span class="text-gray-400 block text-[10px]">ผู้รับสินค้า</span>
                    <span class="font-bold text-gray-800">${customerName}</span>
                  </div>
                  <div>
                    <span class="text-gray-400 block text-[10px]">เบอร์โทรศัพท์</span>
                    <span class="font-semibold text-gray-800">${customerPhone}</span>
                  </div>
                  <div>
                    <span class="text-gray-400 block text-[10px]">อีเมล</span>
                    <span class="text-gray-700">${customerEmail}</span>
                  </div>
                  <div>
                    <span class="text-gray-400 block text-[10px]">รหัสผู้ใช้งาน</span>
                    <span class="font-medium text-gray-800">${order.user_id || '-'}</span>
                  </div>
                </div>
                <div class="text-[11px] text-gray-600 pt-2 border-t border-gray-100">
                  <span class="text-gray-400 block text-[10px]">ที่อยู่จัดส่ง</span>
                  <p id="addressText-${order.id}" class="mt-0.5 leading-relaxed font-medium text-gray-800">${customerAddress}</p>
                  
                  <!-- ฟอร์มแก้ไขที่อยู่ -->
                  <div id="addressEditBox-${order.id}" class="hidden mt-2">
                    <textarea id="addressInput-${order.id}" rows="3" class="w-full p-2 text-xs border border-gray-300 rounded-xl focus:outline-none focus:border-[#8a6e11] bg-white">${customerAddress}</textarea>
                    <div class="flex gap-2 mt-2 justify-end">
                      <button onclick="saveAddress('${order.id}')" class="px-3 py-1 bg-[#8a6e11] hover:bg-[#725a0e] text-white text-[10px] font-bold rounded-lg transition">
                        บันทึกที่อยู่
                      </button>
                      <button onclick="editAddress('${order.id}')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-[10px] font-bold rounded-lg transition">
                        ยกเลิก
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-4 pt-3 border-t border-gray-100">
                <h6 class="text-[11px] font-bold text-gray-700 mb-1">รายการสินค้าในออเดอร์</h6>
                ${itemsHtml}
              </div>
            </div>

            <div class="md:col-span-5 bg-gray-50/50 p-4 rounded-xl border border-gray-100 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <i class="fa-regular fa-file-image text-amber-600 text-xs"></i>
                    <h5 class="text-xs font-bold text-gray-800">หลักฐานการชำระเงิน (สลิปโอน)</h5>
                  </div>
                </div>
                ${slipHtml}
              </div>

              ${isAdminOrStaff && (status === 'pending' || status === 'paid' || status === 'รอตรวจสอบ') ? `
                <div class="mt-4 pt-3 border-t border-gray-100">
                  <span class="text-[10px] font-bold text-gray-500 block mb-2">การอนุมัติคำสั่งซื้อ (เจ้าหน้าที่)</span>
                  <div class="grid grid-cols-2 gap-2">
                    <button onclick="updateOrderStatus('${order.id}', 'approved')" class="bg-[#795d0d] hover:bg-[#634c09] text-white py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                      <i class="fa-solid fa-circle-check text-xs"></i> อนุมัติ
                    </button>
                    <button onclick="updateOrderStatus('${order.id}', 'cancelled')" class="bg-white border border-red-200 hover:bg-red-50 text-red-600 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                      <i class="fa-solid fa-circle-xmark text-xs"></i> ปฏิเสธ
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;

        container.appendChild(orderCard);
      });
    }

    function toggleOrderDetail(orderId) {
      const detailEl = document.getElementById(`detail-${orderId}`);
      if (detailEl) {
        detailEl.classList.toggle('hidden');
      }
    }

    function editAddress(orderId) {
      const textEl = document.getElementById(`addressText-${orderId}`);
      const editBox = document.getElementById(`addressEditBox-${orderId}`);
      const btnEdit = document.getElementById(`btnEditAddress-${orderId}`);

      if (editBox.classList.contains('hidden')) {
        editBox.classList.remove('hidden');
        textEl.classList.add('hidden');
        if (btnEdit) btnEdit.classList.add('hidden');
      } else {
        editBox.classList.add('hidden');
        textEl.classList.remove('hidden');
        if (btnEdit) btnEdit.classList.remove('hidden');
      }
    }

    async function saveAddress(orderId) {
      const newAddress = document.getElementById(`addressInput-${orderId}`).value.trim();
      
      if (!newAddress) {
        alert('กรุณากรอกข้อมูลที่อยู่');
        return;
      }

      try {
        const client = DB.getClient();
        const { error } = await client
          .from('orders')
          .update({ 
            address: newAddress,
            shipping_address: newAddress 
          })
          .eq('id', orderId);

        if (error) throw error;

        alert('แก้ไขที่อยู่สำเร็จเรียบร้อย');
        await loadOrderHistory();
      } catch (err) {
        console.error('Error updating address:', err);
        alert('เกิดข้อผิดพลาดในการบันทึกที่อยู่: ' + err.message);
      }
    }

    async function updateOrderStatus(orderId, newStatus) {
      if (!confirm(`คุณต้องการเปลี่ยนสถานะออเดอร์นี้เป็น "${newStatus === 'approved' ? 'อนุมัติ' : 'ยกเลิก'}" ใช่หรือไม่?`)) {
        return;
      }

      try {
        const client = DB.getClient();
        const { error } = await client
          .from('orders')
          .update({ status: newStatus })
          .eq('id', orderId);

        if (error) throw error;

        alert('อัปเดตสถานะสำเร็จ');
        await loadOrderHistory();
      } catch (err) {
        console.error('Error updating order status:', err);
        alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ: ' + err.message);
      }
    }

    function getStatusBadge(status) {
      const st = String(status || '').toLowerCase().trim();

      if (['approved', 'completed', 'paid', 'อนุมัติแล้ว', 'สำเร็จ'].includes(st)) {
        return `<span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ชำระแล้ว (อนุมัติเรียบร้อย)
        </span>`;
      } else if (['cancelled', 'rejected', 'ยกเลิก', 'ปฏิเสธ'].includes(st)) {
        return `<span class="inline-flex items-center gap-1.5 bg-red-50 text-red-700 text-[10px] font-bold px-2.5 py-1 rounded-full border border-red-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> ยกเลิกคำสั่งซื้อ
        </span>`;
      } else {
        return `<span class="inline-flex items-center gap-1.5 bg-amber-50 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full border border-amber-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> รอตรวจสอบการชำระเงิน
        </span>`;
      }
    }

    function openImageModal(url) {
      if (!url) return;
      document.getElementById('modalImg').src = url;
      document.getElementById('modalDownloadBtn').href = url;
      const modal = document.getElementById('imageModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;

      const buttons = {
        all: document.getElementById('btnFilterAll'),
        pending: document.getElementById('btnFilterPending'),
        approved: document.getElementById('btnFilterApproved'),
        cancelled: document.getElementById('btnFilterCancelled')
      };

      Object.keys(buttons).forEach(key => {
        if (buttons[key]) {
          if (key === status) {
            buttons[key].className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-[#8a6e11] text-white shadow-sm whitespace-nowrap';
          } else {
            buttons[key].className = 'px-3.5 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5 whitespace-nowrap';
          }
        }
      });

      filterOrders();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterDate').value = '';
      setStatusFilter('all');
    }

    function filterOrders() {
      const searchKeyword = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const filterDateVal = document.getElementById('filterDate').value;

      const filtered = allOrders.filter(order => {
        const st = String(order.status || '').toLowerCase().trim();

        let matchesStatus = true;
        if (currentStatusFilter === 'pending') {
          matchesStatus = (st === 'pending' || st === 'paid' || st === 'รอตรวจสอบ' || st === '');
        } else if (currentStatusFilter === 'approved') {
          matchesStatus = (st === 'approved' || st === 'completed' || st === 'อนุมัติแล้ว');
        } else if (currentStatusFilter === 'cancelled') {
          matchesStatus = (st === 'cancelled' || st === 'rejected' || st === 'ยกเลิก');
        }

        let matchesSearch = true;
        if (searchKeyword) {
          const orderIdStr = String(order.id).toLowerCase();
          const customerName = String(order.profiles?.full_name || '').toLowerCase();
          matchesSearch = orderIdStr.includes(searchKeyword) || customerName.includes(searchKeyword);
        }

        let matchesDate = true;
        if (filterDateVal && order.created_at) {
          const orderDateStr = new Date(order.created_at).toISOString().split('T')[0];
          matchesDate = (orderDateStr === filterDateVal);
        }

        return matchesStatus && matchesSearch && matchesDate;
      });

      renderOrders(filtered);
    }
  </script>
</body>
</html>
