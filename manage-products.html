<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการสินค้า - PP PHONE</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap');
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-[#f7f6f2] min-h-screen text-gray-800 flex flex-col">

  <!-- Navigation Bar -->
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full border-2 border-[#a17d1a] flex flex-col items-center justify-center text-[#a17d1a]">
          <span class="text-[11px] font-extrabold leading-none">PP</span>
          <span class="text-[7px] font-bold tracking-tighter leading-none mt-0.5">PHONE</span>
        </div>
        <span class="text-xl font-extrabold text-[#a17d1a] tracking-wider">PP PHONE</span>
      </a>

      <!-- Menu Navigation -->
      <div class="hidden md:flex items-center gap-8 text-xs font-semibold text-gray-500">
        <a href="index.html" class="hover:text-[#8a6e11] transition">สินค้า</a>
        <a href="order-history.html" class="hover:text-[#8a6e11] transition">ประวัติการสั่งซื้อ</a>
        <a href="manage-products.html" class="text-[#8a6e11] font-bold border-b-2 border-[#8a6e11] pb-1">จัดการสินค้า</a>
        <a href="sales-report.html" id="linkReport" class="hover:text-[#8a6e11] transition hidden">รายงานยอดขาย</a>
      </div>

      <!-- User Profile & Cart Icon -->
      <div class="flex items-center gap-3">
        <a href="cart.html" id="cartBtn" class="relative w-9 h-9 rounded-full bg-[#8a6e11] text-white flex items-center justify-center shadow-sm hover:opacity-90 transition">
          <i class="fa-solid fa-cart-shopping text-xs"></i>
          <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </a>
        
        <div class="flex items-center gap-2">
          <a href="login.html" id="userBadge" class="w-9 h-9 rounded-full bg-[#8a6e11] text-white flex items-center justify-center shadow-sm hover:opacity-90 transition">
            <i class="fa-solid fa-user text-xs"></i>
          </a>
          <button onclick="logout()" id="logoutBtn" class="hidden text-xs text-red-500 font-bold hover:underline ml-1">
            ออกจากระบบ
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">

    <!-- Page Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <div class="flex items-center gap-2 text-[11px] font-bold text-gray-400 tracking-widest uppercase">
          <span class="w-5 h-[2px] bg-gray-400"></span> INVENTORY CONTROL
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 mt-1">จัดการสินค้า</h1>
      </div>
      <button onclick="openAddModal()" class="bg-[#a17d1a] hover:bg-[#896914] text-white px-6 py-3 rounded-full text-xs font-bold flex items-center gap-2 shadow-md hover:shadow-lg transition">
        <i class="fa-solid fa-plus"></i> เพิ่มสินค้า
      </button>
    </div>

    <!-- Search & Filter Bar -->
    <div class="bg-white rounded-2xl p-3 shadow-sm mb-8 flex flex-wrap items-center justify-between gap-4 border border-gray-100">
      <!-- Search Input -->
      <div class="relative flex-1 min-w-[280px]">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ค้นหาสินค้าด้วยชื่อ, รุ่น, หรือรหัส..." class="w-full pl-10 pr-4 py-2.5 bg-[#fbfaf8] rounded-xl text-xs outline-none focus:bg-white focus:ring-1 focus:ring-[#a17d1a] transition">
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-2">
        <button onclick="filterStatus('all')" id="btnFilterAll" class="px-5 py-2 rounded-full text-xs font-bold transition bg-[#f2ede4] text-[#8a6e11]">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#8a6e11] mr-1.5"></span> ทั้งหมด
        </button>
        <button onclick="filterStatus('instock')" id="btnFilterInStock" class="px-5 py-2 rounded-full text-xs font-bold transition bg-[#f7f6f2] text-gray-500 hover:bg-[#eae6dd]">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span> พร้อมส่ง
        </button>
        <button onclick="filterStatus('outstock')" id="btnFilterOutStock" class="px-5 py-2 rounded-full text-xs font-bold transition bg-[#f7f6f2] text-gray-500 hover:bg-[#eae6dd]">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-red-400 mr-1.5"></span> สินค้าหมด
        </button>
      </div>
    </div>

    <!-- Products Grid -->
    <div id="manageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- รายการสินค้าและ Card เพิ่มสินค้าใหม่ จะแสดงผ่าน JS -->
    </div>

  </main>

  <!-- Modal 1: เพิ่มสินค้าใหม่ -->
  <div id="addModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl relative">
      <h3 class="text-lg font-bold text-gray-800 mb-4">เพิ่มสินค้าใหม่</h3>
      
      <form onsubmit="saveNewProduct(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">เลือกประเภทสินค้า</label>
            <select id="addCategory" onchange="onCategoryChange()" class="w-full border rounded-lg p-2 text-xs font-bold text-[#8a6e11] outline-none focus:border-[#8a6e11]">
              <option value="iPhone">iPhone (IP)</option>
              <option value="Accessory">Accessory (AC)</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">รหัสสินค้า (สุ่มอัตโนมัติ)</label>
            <div class="flex gap-2">
              <input type="text" id="addCode" readonly required class="w-full border bg-gray-50 rounded-lg p-2 text-xs font-mono font-bold text-[#8a6e11] outline-none">
              <button type="button" onclick="regenerateAddCode()" class="px-3 bg-gray-200 hover:bg-gray-300 text-xs font-bold rounded-lg transition">
                <i class="fa-solid fa-arrows-rotate"></i>
              </button>
            </div>
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">ชื่อสินค้า</label>
          <input type="text" id="addName" required placeholder="เช่น iPhone 14 Pro Max" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">แท็กพิเศษ</label>
          <select id="addTag" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
            <option value="">ไม่มี</option>
            <option value="NEW">NEW</option>
            <option value="BEST SELLER">BEST SELLER</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">รายละเอียดสินค้า</label>
          <textarea id="addDescription" rows="2" placeholder="สเปก สี ความจุ..." class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">ราคา (บาท)</label>
            <input type="number" step="0.01" id="addPrice" required placeholder="0.00" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">จำนวนสต็อก</label>
            <input type="number" id="addStock" required placeholder="10" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">URL รูปภาพสินค้า</label>
          <input type="url" id="addImageUrl" placeholder="https://example.com/image.jpg" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
        </div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-xs font-bold hover:bg-gray-300 transition">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 bg-[#a17d1a] text-white rounded-lg text-xs font-bold hover:bg-[#896914] transition">บันทึกสินค้า</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: แก้ไขข้อมูลสินค้า -->
  <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl relative">
      <h3 class="text-lg font-bold text-gray-800 mb-4">แก้ไขข้อมูลสินค้า</h3>
      
      <form id="editForm" onsubmit="saveProductEdit(event)" class="space-y-3">
        <input type="hidden" id="editProductId">
        
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">รหัสสินค้า</label>
          <input type="text" id="editCode" readonly class="w-full border bg-gray-100 rounded-lg p-2 text-xs font-mono font-bold text-gray-500 outline-none">
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">ชื่อสินค้า</label>
          <input type="text" id="editName" required class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">รายละเอียดสินค้า</label>
          <textarea id="editDescription" rows="2" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">ราคา (บาท)</label>
            <input type="number" step="0.01" id="editPrice" required class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">จำนวนสต็อก</label>
            <input type="number" id="editStock" required class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">URL รูปภาพสินค้า</label>
          <input type="url" id="editImageUrl" placeholder="https://example.com/image.jpg" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-[#8a6e11]">
        </div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-xs font-bold hover:bg-gray-300 transition">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 bg-[#8a6e11] text-white rounded-lg text-xs font-bold hover:bg-[#735c0f] transition">บันทึกการแก้ไข</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script Logic -->
  <script>
    let allProducts = [];
    let currentStatusFilter = 'all';
    let currentUser = {};

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      
      // ป้องกันการเข้าถึงเฉพาะ Admin และ Staff
      if (currentUser.role !== 'admin' && currentUser.role !== 'staff') {
        alert('หน้านี้สำหรับสิทธิ์ Admin และ Staff เท่านั้น');
        window.location.href = 'index.html';
        return;
      }

      applyRolePermissions();
      await loadProducts();
    });

    function applyRolePermissions() {
      const linkReport = document.getElementById('linkReport');
      const cartBtn = document.getElementById('cartBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (currentUser.username || currentUser.id) {
        if (logoutBtn) logoutBtn.classList.remove('hidden');
      }

      if (currentUser.role === 'admin') {
        if (linkReport) linkReport.classList.remove('hidden');
      }
      if (cartBtn) cartBtn.classList.add('hidden');
    }

    // ดึงข้อมูลสินค้าจาก Supabase
    async function loadProducts() {
      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (client) {
          const { data, error } = await client.from('products').select('*').order('created_at', { ascending: false });
          if (!error && data) {
            allProducts = data;
          }
        }
      } catch (err) {
        console.error('Error fetching products:', err);
      }

      if (!allProducts || allProducts.length === 0) {
        allProducts = [
          { id: '1', code: 'PP-IP14P-256G', name: 'iPhone 14 Pro Max', description: '256GB / Space Black / A16 Bionic / Super Retina XDR', price: 44900, stock: 12, category: 'iPhone', image_url: 'https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=500&auto=format&fit=crop' },
          { id: '2', code: 'PP-IPA12-128S', name: 'iPad Pro 12.9"', description: '128GB / Silver / M2 Chip / Wi-Fi', price: 40900, stock: 5, category: 'Accessory', image_url: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500&auto=format&fit=crop' },
          { id: '3', code: 'PP-APM-S', name: 'AirPods Max', description: 'Silver / Active Noise Cancellation / Spatial Audio', price: 19900, stock: 0, category: 'Accessory', image_url: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500&auto=format&fit=crop' }
        ];
      }

      renderProducts();
    }

    function filterStatus(status) {
      currentStatusFilter = status;
      
      const btnAll = document.getElementById('btnFilterAll');
      const btnIn = document.getElementById('btnFilterInStock');
      const btnOut = document.getElementById('btnFilterOutStock');

      btnAll.className = status === 'all' ? 'px-5 py-2 rounded-full text-xs font-bold transition bg-[#f2ede4] text-[#8a6e11]' : 'px-5 py-2 rounded-full text-xs font-bold transition bg-[#f7f6f2] text-gray-500 hover:bg-[#eae6dd]';
      btnIn.className = status === 'instock' ? 'px-5 py-2 rounded-full text-xs font-bold transition bg-[#f2ede4] text-[#8a6e11]' : 'px-5 py-2 rounded-full text-xs font-bold transition bg-[#f7f6f2] text-gray-500 hover:bg-[#eae6dd]';
      btnOut.className = status === 'outstock' ? 'px-5 py-2 rounded-full text-xs font-bold transition bg-[#f2ede4] text-[#8a6e11]' : 'px-5 py-2 rounded-full text-xs font-bold transition bg-[#f7f6f2] text-gray-500 hover:bg-[#eae6dd]';

      renderProducts();
    }

    function applyFilters() {
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('manageGrid');
      grid.innerHTML = '';

      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allProducts.filter(p => {
        const matchesQuery = (p.name && p.name.toLowerCase().includes(query)) ||
                             (p.code && p.code.toLowerCase().includes(query)) ||
                             (p.description && p.description.toLowerCase().includes(query));
        
        if (!matchesQuery) return false;

        if (currentStatusFilter === 'instock') return p.stock > 0;
        if (currentStatusFilter === 'outstock') return p.stock <= 0;
        return true;
      });

      filtered.forEach(p => {
        const inStock = p.stock > 0;
        const productCode = p.code || `PP-IP-${p.id}`;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-3xl p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between border border-gray-100 relative group';

        card.innerHTML = `
          <div>
            <!-- Image Area with Status & Hover Actions -->
            <div class="w-full h-44 bg-[#f8f7f4] rounded-2xl mb-4 relative flex items-center justify-center overflow-hidden">
              <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-[9px] font-bold tracking-wider uppercase z-10 flex items-center gap-1.5 ${inStock ? 'bg-white/90 text-emerald-600 shadow-sm' : 'bg-white/90 text-red-500 shadow-sm'}">
                <span class="w-1.5 h-1.5 rounded-full ${inStock ? 'bg-emerald-500' : 'bg-red-500'}"></span>
                ${inStock ? 'IN STOCK' : 'OUT OF STOCK'}
              </span>

              <!-- Hover Overlay Action Buttons -->
              <div class="absolute inset-0 bg-white/40 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3 z-20">
                <button onclick="openEditModal('${p.id}')" class="w-10 h-10 rounded-full bg-white text-gray-700 hover:text-[#8a6e11] shadow-md flex items-center justify-center transition hover:scale-110">
                  <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button onclick="deleteProduct('${p.id}')" class="w-10 h-10 rounded-full bg-white text-red-500 hover:text-red-600 shadow-md flex items-center justify-center transition hover:scale-110">
                  <i class="fa-solid fa-trash text-xs"></i>
                </button>
              </div>

              <img src="${p.image_url || 'https://via.placeholder.com/300x200'}" alt="${p.name}" class="object-contain h-full w-full p-4">
            </div>

            <!-- Content -->
            <div class="text-[10px] font-mono text-[#a17d1a] font-bold tracking-wider mb-1">SKU: ${productCode}</div>
            <h3 class="font-bold text-gray-900 text-base mb-1 line-clamp-1">${p.name}</h3>
            <p class="text-[11px] text-gray-400 line-clamp-2 mb-4 font-light leading-relaxed h-8">${p.description || ''}</p>
          </div>

          <!-- Bottom Price & Stock -->
          <div class="flex items-end justify-between pt-2 border-t border-gray-50">
            <div>
              <div class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">PRICE</div>
              <div class="text-xl font-extrabold text-gray-900">฿${Number(p.price).toLocaleString()}</div>
            </div>
            <div class="text-right">
              <div class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">STOCK</div>
              <div class="text-sm font-bold ${inStock ? 'text-gray-800' : 'text-red-500'}">${p.stock}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // Card เพิ่มสินค้าใหม่
      const addCard = document.createElement('div');
      addCard.onclick = openAddModal;
      addCard.className = 'border-2 border-dashed border-gray-200 hover:border-[#a17d1a] bg-[#f8f7f4]/50 hover:bg-[#f8f7f4] rounded-3xl p-6 flex flex-col items-center justify-center min-h-[300px] cursor-pointer transition group text-center';
      addCard.innerHTML = `
        <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-400 group-hover:text-[#a17d1a] group-hover:scale-110 transition mb-3">
          <i class="fa-solid fa-plus text-base"></i>
        </div>
        <span class="text-xs font-bold text-gray-600 group-hover:text-[#a17d1a] transition">เพิ่มสินค้าใหม่</span>
      `;
      grid.appendChild(addCard);
    }

    // Modal Operations
    function generateRandomSKU(category = 'iPhone') {
      const prefix = (category.toLowerCase() === 'iphone' || category === 'IP') ? 'PP-IP' : 'PP-AC';
      const randomDigits = Math.floor(100000 + Math.random() * 900000);
      return `${prefix}-${randomDigits}`;
    }

    function onCategoryChange() {
      const cat = document.getElementById('addCategory').value;
      document.getElementById('addCode').value = generateRandomSKU(cat);
    }

    function regenerateAddCode() {
      const cat = document.getElementById('addCategory').value;
      document.getElementById('addCode').value = generateRandomSKU(cat);
    }

    function openAddModal() {
      const category = document.getElementById('addCategory').value || 'iPhone';
      document.getElementById('addCode').value = generateRandomSKU(category);
      document.getElementById('addName').value = '';
      document.getElementById('addDescription').value = '';
      document.getElementById('addPrice').value = '';
      document.getElementById('addStock').value = '';
      document.getElementById('addImageUrl').value = '';
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    async function saveNewProduct(e) {
      e.preventDefault();

      const newProduct = {
        code: document.getElementById('addCode').value,
        name: document.getElementById('addName').value,
        category: document.getElementById('addCategory').value,
        tag: document.getElementById('addTag').value || null,
        description: document.getElementById('addDescription').value,
        price: parseFloat(document.getElementById('addPrice').value),
        stock: parseInt(document.getElementById('addStock').value),
        image_url: document.getElementById('addImageUrl').value || 'https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=500&auto=format&fit=crop'
      };

      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (client) {
          const { data, error } = await client.from('products').insert([newProduct]).select();
          if (error) throw error;
          if (data && data.length > 0) {
            allProducts.unshift(data[0]);
          }
        } else {
          newProduct.id = Date.now().toString();
          allProducts.unshift(newProduct);
        }

        closeAddModal();
        renderProducts();
        alert('เพิ่มสินค้าใหม่สำเร็จ!');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเพิ่มสินค้า: ' + err.message);
      }
    }

    function openEditModal(productId) {
      const product = allProducts.find(p => p.id == productId);
      if (!product) return;

      document.getElementById('editProductId').value = product.id;
      document.getElementById('editCode').value = product.code || `PP-IP-${product.id}`;
      document.getElementById('editName').value = product.name;
      document.getElementById('editDescription').value = product.description || '';
      document.getElementById('editPrice').value = product.price;
      document.getElementById('editStock').value = product.stock;
      document.getElementById('editImageUrl').value = product.image_url || '';

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function saveProductEdit(e) {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;
      const updatedData = {
        name: document.getElementById('editName').value,
        description: document.getElementById('editDescription').value,
        price: parseFloat(document.getElementById('editPrice').value),
        stock: parseInt(document.getElementById('editStock').value),
        image_url: document.getElementById('editImageUrl').value
      };

      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (client) {
          const { error } = await client.from('products').update(updatedData).eq('id', id);
          if (error) throw error;
        }

        const index = allProducts.findIndex(p => p.id == id);
        if (index !== -1) {
          allProducts[index] = { ...allProducts[index], ...updatedData };
        }

        closeEditModal();
        renderProducts();
        alert('อัปเดตข้อมูลสินค้าเรียบร้อย!');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
      }
    }

    async function deleteProduct(productId) {
      if (!confirm('คุณต้องการลบสินค้ารายการนี้ใช่หรือไม่?')) return;

      try {
        const client = DB.getClient ? DB.getClient() : null;
        if (client) {
          const { error } = await client.from('products').delete().eq('id', productId);
          if (error) throw error;
        }

        allProducts = allProducts.filter(p => p.id != productId);
        renderProducts();
        alert('ลบสินค้าเรียบร้อยแล้ว!');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการลบสินค้า: ' + err.message);
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('userSession');
      window.location.href = 'login.html';
    }
  </script>
</body>
