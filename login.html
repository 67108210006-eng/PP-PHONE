<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - PP PHONE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
</head>
<body class="bg-[#f0f2f5] min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- Main Login Card -->
  <div class="bg-white rounded-3xl shadow-2xl flex flex-col md:flex-row w-full max-w-4xl overflow-hidden min-h-[520px]">
    
    <!-- Left Column: Branding Section -->
    <div class="md:w-1/2 bg-[#e6e6e6] p-10 flex flex-col items-center justify-center relative">
      <div class="w-48 h-48 bg-white rounded-full shadow-lg flex items-center justify-center p-4 mb-4 border border-gray-100/50">
        <div class="text-center">
          <div class="text-4xl font-extrabold text-[#b89322] tracking-wider">PP</div>
          <div class="text-[10px] font-bold text-[#b89322] tracking-widest border-t border-b border-[#b89322] my-1 py-0.5 uppercase">PP PHONE</div>
        </div>
      </div>
      <h1 class="text-2xl font-black text-[#b89322] tracking-wider mt-2">PP PHONE</h1>
      <div class="w-10 h-0.5 bg-[#b89322]/40 mt-3 rounded-full"></div>
    </div>

    <!-- Right Column: Login Form -->
    <div class="md:w-1/2 p-10 md:p-14 flex flex-col justify-center bg-white">
      <h2 class="text-2xl font-extrabold text-gray-800 mb-1">Welcome Back</h2>
      <p class="text-[11px] text-gray-400 mb-8">Sign in to continue to PP PHONE.</p>

      <form class="space-y-6" onsubmit="handleLogin(event)">
        
        <!-- Username Field -->
        <div class="relative border-b border-gray-200 focus-within:border-[#8a6e11] py-1 transition">
          <span class="absolute left-0 top-2 text-gray-400 text-xs"><i class="fa-regular fa-user"></i></span>
          <input type="text" id="username" required placeholder="Username" class="w-full pl-6 pr-3 py-1 text-xs outline-none bg-transparent text-gray-700">
        </div>

        <!-- Password Field with Toggle Eye -->
        <div class="relative border-b border-gray-200 focus-within:border-[#8a6e11] py-1 transition">
          <span class="absolute left-0 top-2 text-gray-400 text-xs"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="password" required placeholder="Password" class="w-full pl-6 pr-8 py-1 text-xs outline-none bg-transparent text-gray-700">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-0 top-2 text-gray-400 hover:text-gray-600 text-xs focus:outline-none">
            <i id="togglePasswordIcon" class="fa-solid fa-eye-slash"></i>
          </button>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3 pt-3">
          <button type="submit" class="w-full bg-[#8a6e11] hover:bg-[#735c0f] text-white py-3 rounded-xl text-xs font-bold transition shadow-sm">
            เข้าสู่ระบบ
          </button>
          <a href="register.html" class="block w-full text-center border border-gray-200 hover:bg-gray-50 text-gray-600 py-3 rounded-xl text-xs font-bold transition">
            สมัครสมาชิก
          </a>
        </div>

        <!-- Notification Message Area -->
        <div id="errorAlert" class="hidden text-red-500 text-[11px] text-center p-2.5 rounded-lg bg-red-50 border border-red-100 mt-2"></div>
      </form>
    </div>

  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('togglePasswordIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');

      errorAlert.classList.add('hidden');

      const result = await DB.login(username, password);

      if (result.success) {
        // บันทึก Session เก็บข้อมูลสิทธิ์ผู้ใช้งาน
        localStorage.setItem('currentUser', JSON.stringify(result));
        localStorage.setItem('userSession', JSON.stringify(result));
        
        // เข้าสู่ระบบสำเร็จ เปลี่ยนหน้าไป index.html
        window.location.href = 'index.html';
      } else {
        errorAlert.innerText = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
        errorAlert.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
